apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fallow-leader-election-rolebinding
  namespace: fallow-system
  labels:
    app.kubernetes.io/name: fallow
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fallow-leader-election-role
subjects:
  - kind: ServiceAccount
    name: fallow-controller-manager
    namespace: fallow-system
